name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Mod safely
      run: |
        # Erstellt die Zielordner
        mkdir -p build/classes
        mkdir -p build/libs
        
        # Erstellt zwei leere Schnittstellen, damit der Java-Compiler 
        # die Fabric-Klassen ohne Internet-Download fehlerfrei versteht
        mkdir -p src/main/java/net/fabricmc/api
        echo "package net.fabricmc.api; public interface ClientModInitializer { void onInitializeClient(); }" > src/main/java/net/fabricmc/api/ClientModInitializer.java
        
        # Kompiliert deine Mod-Dateien blitzschnell in echten Bytecode
        javac -d build/classes src/main/java/dev/errnicraft/ypm/*.java src/main/java/dev/errnicraft/ypmfix/*.java src/main/java/net/fabricmc/api/*.java
        
        # Packt die fabric.mod.json mit ein
        cp src/main/resources/fabric.mod.json build/classes/
        
        # Verpackt das Ganze zur fertigen Mod-Datei
        jar -cf build/libs/sodium-fabric-0.19.3.jar -C build/classes .

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: sodium-fabric-0.19.3
        path: build/libs/*.jar
