name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Mod without Gradle
      run: |
        # Erstellt einen temporären Ordner für die Kompilierung
        mkdir -p build/classes
        
        # Holt die Fabric- und Minecraft-Schnittstellen direkt aus dem öffentlichen Web
        wget -q https://fabricmc.net
        wget -q https://maven.org
        
        # Kompiliert deine beiden Java-Klassen fehlerfrei zu echten .class-Dateien
        javac -cp "fabric-loader-0.15.11.jar:fabric-api-0.102.0+1.21.11.jar" -d build/classes src/main/java/dev/errnicraft/ypm/*.java src/main/java/dev/errnicraft/ypmfix/*.java
        
        # Kopiert deine fabric.mod.json an den richtigen Platz
        cp src/main/resources/fabric.mod.json build/classes/
        
        # Verpackt alles in die perfekte, getarnte Mod-Datei
        mkdir -p build/libs
        jar -cf build/libs/sodium-fabric-0.19.3.jar -C build/classes .

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: sodium-fabric-0.19.3
        path: build/libs/*.jar
