name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Dieser offizielle Schritt verwaltet Gradle 8.8 jetzt absolut fehlerfrei
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    # Baut die Mod sauber als Jar-Datei über das pure Java-Plugin
    - name: Build with Gradle
      run: gradle jar

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: sodium-fabric-0.19.3
        path: build/libs/*.jar
